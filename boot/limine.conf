timeout: 3
serial: yes
default_entry: 2

/+Nirmala
    //Nirmala Live System x86_64
        protocol: limine
        path: boot():/boot/nirmala
        module_path: boot():/boot/initrd.tar
        cmdline: @CMDLINE@

    //Nirmala Text Install
        protocol: limine
        path: boot():/boot/nirmala
        module_path: boot():/boot/initrd.tar
        cmdline: root=ram init=/bin/install
